# Sole source of truth for Regi.xcodeproj. The .xcodeproj is generated and
# gitignored — never edit it by hand. Adding a source file means adding the
# file; the next generate picks it up.
#
#   brew install xcodegen && xcodegen generate
#
# Only settings specific to this project are listed. Everything else —
# PRODUCT_NAME, SDKROOT, the debug/release basics, schemes — comes from
# XcodeGen's defaults.

name: Regi

options:
  deploymentTarget:
    macOS: "14.0"

packages:
  KVMKit:
    path: Packages/KVMKit
  ProbeKit:
    path: Packages/ProbeKit
  # The MCP server's protocol layer (App/MCP). Pinned exactly: the Xcode
  # workspace's Package.resolved is gitignored, so a range would float.
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1

settingGroups:
  macApp:
    # Real signing rather than ad-hoc, so the code-signing identity is stable
    # across rebuilds. TCC anchors an Accessibility grant to the designated
    # requirement, and an ad-hoc signature's requirement is its own cdhash —
    # which changes every build, silently revoking keyboard capture each time.
    #
    # Developer ID rather than Apple Development: the requirement then anchors
    # on the team OU rather than a leaf certificate's common name, so it
    # survives certificate churn — an auto-created dev cert being revoked is
    # what broke this before — and matches the notarized release build, so one
    # grant covers both. Manual style because Xcode rejects a Developer ID
    # identity under automatic signing at build time.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: NX94Z8676R

    # Required before a build can be notarized; harmless until then.
    ENABLE_HARDENED_RUNTIME: YES

    # Both targets ship a hand-written, commented Info.plist (ATS, the Bonjour
    # service list, usage strings). Never synthesise one over it.
    GENERATE_INFOPLIST_FILE: NO

    # Extracts Localizable.xcstrings entries from source at build time.
    SWIFT_EMIT_LOC_STRINGS: YES

    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:

  Regi:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: KVMKit
        product: KVMKit
      - package: MCP
        product: MCP
      # The stdio relay MCP clients launch, shipped at Contents/MacOS/regi-mcp
      # (TablePlus's tableplus-mcp layout) and signed with the app.
      - target: regi-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      groups: [macApp]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # XcodeGen's default is NO. Kept on the app only — the probe has never
        # been dead-code stripped and turning it on there would be a real
        # linker change for no reason.
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.regi.mac

  # stdio ↔ the app's MCP socket. No dependencies: the protocol is in the app.
  regi-mcp:
    type: tool
    platform: macOS
    sources: [MCPBridge]
    settings:
      groups: [macApp]
      base:
        # Ships only inside Regi.app. Installing it into the archive too
        # makes it a generic archive that -exportArchive can't export.
        SKIP_INSTALL: YES

  RegiProbe:
    type: application
    platform: macOS
    # Scoped to the app directory, not Probe/ — the README lives one level up
    # and must not be swept into the target.
    sources: [Probe/RegiProbe]
    dependencies:
      - package: ProbeKit
        product: ProbeKit
    settings:
      groups: [macApp]
      base:
        # No App Sandbox and no entitlements file, on purpose: the sandbox
        # blocks session event taps outright, and the tap is the probe's only
        # means of capture.
        INFOPLIST_FILE: Probe/RegiProbe/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.regi.probe
