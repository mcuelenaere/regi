# Tag-triggered release workflow. Produces a Regi.zip (bare .app)
# and a Regi.dmg (drag-to-Applications installer), attached to a
# GitHub Release auto-generated from commits since the previous
# tag. Push a tag like `v0.1.0` to trigger.
#
# workflow_dispatch is also accepted so you can dry-run the build
# from a branch without cutting a tag. Branch-triggered runs skip
# the GitHub Release and upload the artifacts via
# actions/upload-artifact instead, so test runs don't create
# public releases.
#
# Builds are signed with the team's Developer ID, notarized and
# stapled, so they open without a Gatekeeper prompt and keep a stable
# code-signing identity across updates (which the Accessibility grant
# behind keyboard lock is anchored to). Required repo secrets:
#
#   DEVELOPER_ID_P12_BASE64    base64 of the exported Developer ID
#                              Application certificate + private key
#   DEVELOPER_ID_P12_PASSWORD  password the .p12 was exported with
#   NOTARY_KEY_P8              contents of the App Store Connect API
#                              key (.p8, "Developer" role is enough)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the App Store Connect issuer ID
#
# Optional:
#
#   HOMEBREW_TAP_TOKEN         fine-grained token with Contents write
#                              on mcuelenaere/homebrew-tap; when set,
#                              tagged releases bump Casks/regi.rb there

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45   # notarization usually takes minutes, occasionally longer
    permissions:
      contents: write   # required for softprops/action-gh-release

    env:
      SCHEME: Regi
      PRODUCT: Regi

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true   # the UI element detector's Core ML weights

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Regi.xcodeproj is generated from project.yml and is not in the repo.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      # Tag-triggered → use the tag name (with leading `v` stripped).
      # workflow_dispatch on a branch → synthesise a dev version
      # from the short SHA so the build still has a valid
      # MARKETING_VERSION/CURRENT_PROJECT_VERSION and produces
      # inspectable artifacts. Release upload is gated separately
      # so test runs don't create real GitHub Releases.
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              IS_RELEASE=true
              ;;
            refs/tags/*)
              VERSION="${GITHUB_REF#refs/tags/}"
              IS_RELEASE=true
              ;;
            *)
              VERSION="0.0.0-${GITHUB_SHA:0:7}"
              IS_RELEASE=false
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "::notice::Build version $VERSION (release: $IS_RELEASE)"

      # Key on KVMKit's manifest, matching build.yml and for the same reason:
      # that manifest is the only place the pins live. The workspace
      # Package.resolved this used to hash is gitignored — and now lives inside a
      # generated project — so hashing it collapsed the key to a constant.
      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/artifacts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/KVMKit/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # A throwaway keychain holding only the Developer ID identity,
      # added to the search list so codesign finds it. Deleted again in
      # the last step, whatever happened in between.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not set; see the header of release.yml"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Signing settings (Developer ID, team, hardened runtime) come
      # from project.yml, the same as local builds.
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Regi.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath build/Regi.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export .app from archive
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>NX94Z8676R</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Regi.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      # Build the .dmg by hand with hdiutil instead of `brew install
      # create-dmg`. The Homebrew create-dmg (andreyvit's Bash port)
      # drives Finder via osascript to lay out icons inside the disk
      # image — that needs a logged-in GUI session and is famously
      # flaky on headless macOS runners. hdiutil with a staging
      # folder gives us a perfectly usable drag-to-Applications
      # installer (Regi.app + /Applications symlink) with zero
      # AppleScript involvement.
      - name: Package .app as Regi.dmg
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # `ditto` preserves bundle metadata (extended attributes,
          # the signature) that `cp -R` can mangle.
          ditto build/export/Regi.app "$STAGE/Regi.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Regi" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            build/Regi.dmg
          rm -rf "$STAGE"
          codesign --sign "Developer ID Application" --timestamp build/Regi.dmg

      # One submission covers both artifacts: notarizing the outermost
      # container also issues tickets for the code inside it, so the
      # exported .app can be stapled from the same submission.
      - name: Notarize and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          RESULT=$(xcrun notarytool submit build/Regi.dmg "${AUTH[@]}" \
            --wait --timeout 30m --output-format json)
          echo "$RESULT"
          ID=$(echo "$RESULT" | plutil -extract id raw -)
          STATUS=$(echo "$RESULT" | plutil -extract status raw -)
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}"
            echo "::error::Notarization finished with status $STATUS"
            exit 1
          fi
          rm "$KEY"
          xcrun stapler staple build/Regi.dmg
          xcrun stapler staple build/export/Regi.app

      # Zipped after stapling so the ticket travels inside the bundle.
      - name: Package .app as Regi.zip
        run: |
          # `ditto -c -k --keepParent` is the macOS-canonical way to
          # zip an .app preserving bundle structure (regular `zip`
          # mangles extended attributes).
          ditto -c -k --keepParent build/export/Regi.app build/Regi.zip

      # Ask Gatekeeper itself, so a broken signature or a missing
      # ticket fails the run instead of a user's first launch.
      - name: Verify Gatekeeper acceptance
        run: |
          set -euo pipefail
          spctl --assess --type execute -vvv build/export/Regi.app
          spctl --assess --type open --context context:primary-signature -vvv build/Regi.dmg
          xcrun stapler validate build/export/Regi.app
          xcrun stapler validate build/Regi.dmg

      # Tag-triggered runs → real GitHub Release with auto-generated
      # notes. workflow_dispatch / branch test runs → upload as a
      # workflow artifact so you can download and inspect without
      # creating a public release.
      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Regi.zip
            build/Regi.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

      # Point the cask at the dmg just released. The cask itself lives
      # in the tap; only version and sha256 change per release. By now
      # the release is public, so a missing token warns instead of
      # failing the run.
      - name: Bump Homebrew cask
        if: steps.version.outputs.is_release == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the cask bump"
            exit 0
          fi
          SHA=$(shasum -a 256 build/Regi.dmg | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/mcuelenaere/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          # Whole-line replace, so the placeholder comment on sha256 goes too.
          sed -i '' -E "s/^  version .*/  version \"$VERSION\"/; s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/regi.rb
          # A re-run of the same release has nothing to change.
          if git diff --quiet; then echo "Cask already at $VERSION"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "regi $VERSION"
          git push

      - name: Upload artifacts (test runs)
        if: steps.version.outputs.is_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: regi-${{ steps.version.outputs.version }}
          path: |
            build/Regi.zip
            build/Regi.dmg

      - name: Delete signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
