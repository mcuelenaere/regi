name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Regi.xcodeproj is generated from project.yml and is not in the repo.
      # `settingPresets: none` in the spec means no build setting comes from
      # XcodeGen itself, so an unpinned install can't silently shift compiler
      # flags; project.yml's minimumXcodeGenVersion guards the lower bound.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      # The WebRTC binary target is ~100MB. SwiftPM caches it under
      # the project's DerivedData; key on KVMKit's Package.swift so a
      # pin change invalidates the cache. That manifest is the only
      # place the pins live — the Xcode project references KVMKit as a
      # local package and carries no remote pin of its own, and the
      # workspace Package.resolved is gitignored, so hashing that here
      # would silently collapse the key to a constant. The package
      # tests below also reuse the same cache via package-level
      # `swift test --package-path …`, which writes its own
      # `.build/` — that one's small and not worth caching.
      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/artifacts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/KVMKit/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # CODE_SIGNING_ALLOWED=NO disables both signing and provisioning
      # so we can build without a Developer ID on the runner. The
      # output app won't be runnable on Gatekeeper-enforced systems,
      # but for a build-passes signal that's irrelevant. When release
      # builds land, they'll need their own signed workflow.
      - name: Build app
        run: |
          xcodebuild \
            -project Regi.xcodeproj \
            -scheme Regi \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # RegiProbe was never built by CI while it lived in its own project, so it
      # could break unnoticed. It only depends on ProbeKit — no WebRTC — so this
      # costs little.
      - name: Build probe
        run: |
          xcodebuild \
            -project Regi.xcodeproj \
            -scheme RegiProbe \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test KVMKit
        run: swift test --package-path Packages/KVMKit

      - name: Test ProbeKit
        run: swift test --package-path Packages/ProbeKit

      - name: Test regi-e2e
        run: swift test --package-path Tools/regi-e2e
